# fleet-images.conf — the crunchtools images cve-scan scans, one per line.
#
# Full quay refs; a missing tag defaults to :latest. Lines starting with # and
# blank lines are ignored. Only the first field is read, so a trailing comment
# is fine.
#
# WHY A LIST, NOT "what is running". A oneshot (deployer, grype itself) is not
# running at scan time, and a running-containers scan would miss exactly the
# images most likely to sit stale. So the target set is explicit. Each image is
# scanned against the local podman store first (no re-pull, and the local digest
# is what is actually exposed in production); absent locally, it falls back to a
# registry pull.
#
# WHAT IS HERE. The deployed service images plus the oneshots. Pure base/cascade
# images (ubi10-*, *-base) are intentionally absent: they run nowhere, and their
# CVEs reach production only through a child image that IS listed, so scanning
# the child covers the exposure. Forks are listed — a fork's running image still
# carries base-image CVEs that a rebuild clears.
#
# OVERRIDE. The grype unit on gloval mounts the host's authoritative list over
# this one (the fleet's source of truth is crunchtools/nagios-agent
# registry-images.conf). This file is the sane default and the CI/test target.

# ── oneshots (never running at scan time; the reason this is a list) ──────────
