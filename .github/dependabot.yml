# See constitution.md XV. github-actions is required for every repo; docker
# tracks the ubi10-minimal base in the Containerfile. The grype binary pin
# (GRYPE_VERSION ARG) is bumped by hand or by the weekly rebuild, not Dependabot.
# crunchtools/constitution is ignored: its pin moves with `Inherits:` through
# scripts/fleet-bump.py, and a lone pin bump would fail validation.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "crunchtools/constitution*"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
